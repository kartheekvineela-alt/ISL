<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 340" width="1000" height="340" font-family="Helvetica, Arial, sans-serif">
<title>SignVaani system architecture</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#555555"/></marker></defs>
<rect width="1000" height="340" fill="#ffffff"/>
<rect x="20" y="30" width="160" height="64" rx="8" fill="#2a7f8f" stroke="none"/>
<text x="100.0" y="55.5" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="bold" fill="#ffffff">Webcam</text>
<text x="100.0" y="70.5" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#ffffff">OpenCV, 30 FPS</text>
<rect x="220" y="30" width="160" height="64" rx="8" fill="#1f3a5f" stroke="none"/>
<text x="300.0" y="55.5" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="bold" fill="#ffffff">MediaPipe</text>
<text x="300.0" y="70.5" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#ffffff">Holistic landmarks</text>
<rect x="420" y="30" width="160" height="64" rx="8" fill="#1f3a5f" stroke="none"/>
<text x="500.0" y="49.0" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="bold" fill="#ffffff">Preprocess</text>
<text x="500.0" y="64.0" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#ffffff">select 63 pts,</text>
<text x="500.0" y="77.0" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#ffffff">normalise, velocity</text>
<rect x="620" y="30" width="160" height="64" rx="8" fill="#1f3a5f" stroke="none"/>
<text x="700.0" y="49.0" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="bold" fill="#ffffff">Sign spotter</text>
<text x="700.0" y="64.0" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#ffffff">motion gate +</text>
<text x="700.0" y="77.0" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#ffffff">IDLE class</text>
<rect x="820" y="30" width="160" height="64" rx="8" fill="#8b2f3c" stroke="none"/>
<text x="900.0" y="55.5" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="bold" fill="#ffffff">Classifier</text>
<text x="900.0" y="70.5" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#ffffff">BiGRU (ONNX)</text>
<rect x="20" y="160" width="160" height="64" rx="8" fill="#2a7f8f" stroke="none"/>
<text x="100.0" y="185.5" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="bold" fill="#ffffff">Speaker</text>
<text x="100.0" y="200.5" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#ffffff">audio out</text>
<rect x="220" y="160" width="160" height="64" rx="8" fill="#1f3a5f" stroke="none"/>
<text x="300.0" y="179.0" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="bold" fill="#ffffff">TTS</text>
<text x="300.0" y="194.0" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#ffffff">pyttsx3 (en)</text>
<text x="300.0" y="207.0" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#ffffff">gTTS (hi)</text>
<rect x="420" y="160" width="160" height="64" rx="8" fill="#1f3a5f" stroke="none"/>
<text x="500.0" y="179.0" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="bold" fill="#ffffff">Translation</text>
<text x="500.0" y="194.0" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#ffffff">rules.json</text>
<text x="500.0" y="207.0" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#ffffff">en + hi templates</text>
<rect x="620" y="160" width="160" height="64" rx="8" fill="#1f3a5f" stroke="none"/>
<text x="700.0" y="185.5" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="bold" fill="#ffffff">Sentence builder</text>
<text x="700.0" y="200.5" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#ffffff">ISL order -&gt; English</text>
<rect x="820" y="160" width="160" height="64" rx="8" fill="#1f3a5f" stroke="none"/>
<text x="900.0" y="185.5" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="bold" fill="#ffffff">Gloss buffer</text>
<text x="900.0" y="200.5" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#ffffff">accepted signs</text>
<rect x="220" y="270" width="560" height="44" rx="8" fill="#6b5b95" stroke="none"/>
<text x="500.0" y="292.0" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="bold" fill="#ffffff">OpenCV UI: skeleton, top-3 confidence, glosses, sentence, keys</text>
<line x1="180.0" y1="62.0" x2="220.0" y2="62.0" stroke="#555555" stroke-width="1.3" marker-end="url(#arrow)"/>
<line x1="380.0" y1="62.0" x2="420.0" y2="62.0" stroke="#555555" stroke-width="1.3" marker-end="url(#arrow)"/>
<line x1="580.0" y1="62.0" x2="620.0" y2="62.0" stroke="#555555" stroke-width="1.3" marker-end="url(#arrow)"/>
<line x1="780.0" y1="62.0" x2="820.0" y2="62.0" stroke="#555555" stroke-width="1.3" marker-end="url(#arrow)"/>
<line x1="900.0" y1="94.0" x2="900.0" y2="160.0" stroke="#555555" stroke-width="1.3" marker-end="url(#arrow)"/>
<line x1="220.0" y1="192.0" x2="180.0" y2="192.0" stroke="#555555" stroke-width="1.3" marker-end="url(#arrow)"/>
<line x1="420.0" y1="192.0" x2="380.0" y2="192.0" stroke="#555555" stroke-width="1.3" marker-end="url(#arrow)"/>
<line x1="620.0" y1="192.0" x2="580.0" y2="192.0" stroke="#555555" stroke-width="1.3" marker-end="url(#arrow)"/>
<line x1="820.0" y1="192.0" x2="780.0" y2="192.0" stroke="#555555" stroke-width="1.3" marker-end="url(#arrow)"/>
</svg>
