<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 250" width="900" height="250" font-family="Helvetica, Arial, sans-serif">
<title>SignVaani context diagram (DFD level 0)</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#555555"/></marker></defs>
<rect width="900" height="250" fill="#ffffff"/>
<rect x="20" y="95" width="150" height="60" rx="8" fill="#ffffff" stroke="#222222" stroke-width="1.3"/>
<text x="95.0" y="118.5" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="bold" fill="#222222">Deaf user</text>
<text x="95.0" y="133.4" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#222222">(signer)</text>
<ellipse cx="450.0" cy="125.0" rx="75.0" ry="75.0" fill="#1f3a5f" stroke="none"/>
<text x="450.0" y="116.5" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="bold" fill="#ffffff">0.0</text>
<text x="450.0" y="133.4" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="bold" fill="#ffffff">SignVaani System</text>
<rect x="730" y="95" width="150" height="60" rx="8" fill="#ffffff" stroke="#222222" stroke-width="1.3"/>
<text x="805.0" y="118.5" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="bold" fill="#222222">Hearing person</text>
<text x="805.0" y="133.4" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#222222">(listener)</text>
<line x1="170.0" y1="110.0" x2="376.5" y2="110.0" stroke="#555555" stroke-width="1.3" marker-end="url(#arrow)"/>
<text x="273.3" y="99.0" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#222222">ISL signs (video)</text>
<line x1="376.5" y1="140.0" x2="170.0" y2="140.0" stroke="#555555" stroke-width="1.3" marker-end="url(#arrow)"/>
<text x="273.3" y="151.0" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#222222">on-screen feedback</text>
<line x1="523.5" y1="110.0" x2="730.0" y2="110.0" stroke="#555555" stroke-width="1.3" marker-end="url(#arrow)"/>
<text x="626.7" y="99.0" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#222222">speech + caption</text>
<line x1="730.0" y1="140.0" x2="523.5" y2="140.0" stroke="#555555" stroke-width="1.3" marker-end="url(#arrow)"/>
<text x="626.7" y="151.0" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#222222">'speak' / 'clear' keys</text>
</svg>
