<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 580" width="1000" height="580" font-family="Helvetica, Arial, sans-serif">
<title>SignVaani sequence diagram: one sign, then speak</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#555555"/></marker><marker id="open" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10" fill="none" stroke="#555555" stroke-width="1.5"/></marker></defs>
<rect width="1000" height="580" fill="#ffffff"/>
<rect x="15" y="20" width="110" height="40" rx="8" fill="#2a7f8f" stroke="none"/>
<text x="70.0" y="40.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="bold" fill="#ffffff">User</text>
<polyline points="70,60 70,565" fill="none" stroke="#999999" stroke-width="1.3" stroke-dasharray="5 4"/>
<rect x="158" y="20" width="110" height="40" rx="8" fill="#6b5b95" stroke="none"/>
<text x="213.0" y="40.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="bold" fill="#ffffff">Camera / UI</text>
<polyline points="213,60 213,565" fill="none" stroke="#999999" stroke-width="1.3" stroke-dasharray="5 4"/>
<rect x="301" y="20" width="110" height="40" rx="8" fill="#1f3a5f" stroke="none"/>
<text x="356.0" y="40.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="bold" fill="#ffffff">MediaPipe</text>
<polyline points="356,60 356,565" fill="none" stroke="#999999" stroke-width="1.3" stroke-dasharray="5 4"/>
<rect x="444" y="20" width="110" height="40" rx="8" fill="#1f3a5f" stroke="none"/>
<text x="499.0" y="40.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="bold" fill="#ffffff">Spotter</text>
<polyline points="499,60 499,565" fill="none" stroke="#999999" stroke-width="1.3" stroke-dasharray="5 4"/>
<rect x="587" y="20" width="110" height="40" rx="8" fill="#8b2f3c" stroke="none"/>
<text x="642.0" y="40.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="bold" fill="#ffffff">Classifier</text>
<polyline points="642,60 642,565" fill="none" stroke="#999999" stroke-width="1.3" stroke-dasharray="5 4"/>
<rect x="730" y="20" width="110" height="40" rx="8" fill="#1f3a5f" stroke="none"/>
<text x="785.0" y="40.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="bold" fill="#ffffff">Sentence</text>
<polyline points="785,60 785,565" fill="none" stroke="#999999" stroke-width="1.3" stroke-dasharray="5 4"/>
<rect x="873" y="20" width="110" height="40" rx="8" fill="#1f3a5f" stroke="none"/>
<text x="928.0" y="40.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="bold" fill="#ffffff">TTS</text>
<polyline points="928,60 928,565" fill="none" stroke="#999999" stroke-width="1.3" stroke-dasharray="5 4"/>
<polyline points="70,100 213,100" fill="none" stroke="#555555" stroke-width="1.3" marker-end="url(#arrow)"/>
<text x="141.5" y="91.0" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#222222">signs in front of camera</text>
<rect x="173" y="116" width="602" height="124" fill="none" stroke="#555555" stroke-width="1.2" stroke-dasharray="6 4"/>
<text x="181.0" y="128.0" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="bold" fill="#222222">loop  [every frame]</text>
<polyline points="213,160 356,160" fill="none" stroke="#555555" stroke-width="1.3" marker-end="url(#arrow)"/>
<text x="284.5" y="151.0" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#222222">frame (every 33 ms)</text>
<polyline points="356,190 499,190" fill="none" stroke="#555555" stroke-width="1.3" marker-end="url(#arrow)"/>
<text x="427.5" y="181.0" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#222222">63 landmarks</text>
<polyline points="499,208 535,208 535,222 503,222" fill="none" stroke="#555555" stroke-width="1.3" marker-end="url(#arrow)"/>
<rect x="540" y="207" width="220" height="16" fill="#ffffff"/>
<text x="543.0" y="215.0" text-anchor="start" dominant-baseline="central" font-size="11" fill="#222222">motion &gt; on-threshold: open window</text>
<polyline points="499,256 535,256 535,270 503,270" fill="none" stroke="#555555" stroke-width="1.3" marker-end="url(#arrow)"/>
<rect x="540" y="255" width="182" height="16" fill="#ffffff"/>
<text x="543.0" y="263.0" text-anchor="start" dominant-baseline="central" font-size="11" fill="#222222">quiet 8 frames: close window</text>
<polyline points="499,306 642,306" fill="none" stroke="#555555" stroke-width="1.3" marker-end="url(#arrow)"/>
<text x="570.5" y="297.0" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#222222">32 x 378 features</text>
<polyline points="642,340 499,340" fill="none" stroke="#555555" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#open)"/>
<text x="570.5" y="331.0" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#222222">probabilities</text>
<polyline points="499,374 213,374" fill="none" stroke="#555555" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#open)"/>
<text x="356.0" y="365.0" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#222222">sign + confidence (p &gt; 0.8, not IDLE)</text>
<polyline points="70,418 213,418" fill="none" stroke="#555555" stroke-width="1.3" marker-end="url(#arrow)"/>
<text x="141.5" y="409.0" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#222222">press SPACE</text>
<polyline points="213,452 785,452" fill="none" stroke="#555555" stroke-width="1.3" marker-end="url(#arrow)"/>
<text x="499.0" y="443.0" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#222222">gloss list</text>
<polyline points="785,486 213,486" fill="none" stroke="#555555" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#open)"/>
<text x="499.0" y="477.0" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#222222">sentence (en / hi)</text>
<polyline points="213,520 928,520" fill="none" stroke="#555555" stroke-width="1.3" marker-end="url(#arrow)"/>
<text x="570.5" y="511.0" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#222222">speak(text)</text>
<polyline points="928,554 70,554" fill="none" stroke="#555555" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#open)"/>
<text x="499.0" y="545.0" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#222222">audio</text>
</svg>
